<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="1000" height="60">
  <defs>
    <filter id="greenGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="redGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="flareGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#00ff66" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00c853" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00c853" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="flareRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#ff3366" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#d50000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d50000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Green Peak Flare Glow -->
  <path d="M 60,42 Q 115,12 170,42 Z" fill="#00e676" filter="url(#greenGlow)" opacity="0.85" />
  <ellipse cx="115" cy="38" rx="25" ry="12" fill="url(#flareGreen)" />

  <!-- Red Peak Flare Glow -->
  <path d="M 810,42 Q 865,12 920,42 Z" fill="#ff1744" filter="url(#redGlow)" opacity="0.85" />
  <ellipse cx="865" cy="38" rx="25" ry="12" fill="url(#flareRed)" />

  <!-- Green Bar Left (0 to 330) -->
  <path d="M 10,42 L 330,42" stroke="#00c853" stroke-width="4" stroke-linecap="round" />
  <path d="M 60,42 Q 115,22 170,42" fill="#00c853" stroke="#00e676" stroke-width="2" />

  <!-- White Bar Middle (330 to 670) -->
  <path d="M 330,42 L 670,42" stroke="#ffffff" stroke-width="4" stroke-linecap="square" />

  <!-- Red Bar Right (670 to 990) -->
  <path d="M 670,42 L 990,42" stroke="#d50000" stroke-width="4" stroke-linecap="round" />
  <path d="M 810,42 Q 865,22 920,42" fill="#d50000" stroke="#ff1744" stroke-width="2" />

  <!-- High-bright center lines -->
  <path d="M 10,42 L 330,42" stroke="#b9f6ca" stroke-width="1.5" />
  <path d="M 330,42 L 670,42" stroke="#ffffff" stroke-width="2" />
  <path d="M 670,42 L 990,42" stroke="#ff8a80" stroke-width="1.5" />

  <!-- Center hot flares -->
  <circle cx="115" cy="38" r="3" fill="#ffffff" />
  <circle cx="865" cy="38" r="3" fill="#ffffff" />
</svg>
